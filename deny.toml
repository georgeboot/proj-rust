# cargo-deny configuration: supply-chain gates for advisories, licenses,
# duplicate versions, and registry sources. Run: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2026-0344: geotiff-reader 0.8.1 pins tiff-reader 0.8.1 to vulnerable
# ruzstd 0.8.1. The GeoTIFF grid loader rejects TIFF ZSTD and LERC+ZSTD in
# every IFD before decoding. Remove this exception after upstream upgrades.
ignore = ["RUSTSEC-2026-0344"]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
    { crate = "redox_syscall@0.5.18", reason = "Target-specific transitive dependencies require disjoint redox_syscall release lines" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
